<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathRush - Nivel 4</title>
    <link rel="icon" type="image/png" href="../dist/img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/introjs.min.css">
    <link rel="stylesheet" href="../dist/css/index.css">
</head>

<body>
    <div class="container py-2">
        <div class="game-container">
            <div class="card main-card shadow-lg border-0" style="border-top: 5px solid #fd7e14 !important;">
                <div class="card-body p-3 text-center">

                    <h2 class="font-weight-bold mb-0 text-warning">Nivel 4: Maestro</h2>
                    <p class="text-muted small mb-3">Potencias y Raíces Cuadradas</p>

                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <small id="progressText" class="font-weight-bold text-uppercase text-muted"
                            data-intro="El camino se vuelve más difícil. ¡No te rindas!" data-step="1">
                            Pregunta 1/5
                        </small>

                        <button class="btn btn-sm btn-info rounded-circle shadow-sm" id="helpBtn"
                            data-intro="¿Necesitas un recordatorio de cómo funcionan las potencias? Pulsa aquí."
                            data-step="2">
                            <i class="bi bi-question-lg"></i>
                        </button>

                        <span id="liveScore" class="badge badge-pill badge-primary px-3"
                            data-intro="Tus puntos acumulados en este nivel." data-step="3">
                            Puntos: 0
                        </span>
                    </div>

                    <div class="progress-container mb-3">
                        <div class="progress-fill" id="progressBar"
                            style="background: linear-gradient(90deg, #fd7e14, #ffc107);"></div>
                    </div>

                    <div class="question-box text-center"
                        data-intro="Recuerda: Una potencia es multiplicar el número por sí mismo, y la raíz es buscar el número original."
                        data-step="4">
                        <h1 id="questionText" class="animate-slide font-weight-bold" style="font-size: 2.8rem;">---</h1>
                    </div>

                    <div id="optionsList" class="row no-gutters" data-intro="Analiza los resultados con calma."
                        data-step="5">
                    </div>

                    <div class="mt-4 d-flex justify-content-between align-items-center">
                        <button class="btn btn-sm btn-link text-muted" id="backBtn">
                            <i class="bi bi-box-arrow-left"></i> Volver
                        </button>
                        <button class="btn btn-warning text-white px-4 rounded-pill shadow-sm" id="nextBtn"
                            data-intro="Avanza al siguiente reto de este nivel." data-step="6">
                            Siguiente <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/intro.min.js"></script>
    <script src="../dist/js/levels.js"></script>

    <div class="modal fade" id="modalResultados" tabindex="-1" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
                <div class="modal-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-trophy-fill text-warning"
                            style="font-size: 5rem; filter: drop-shadow(0 0 10px rgba(255,193,7,0.5));"></i>
                    </div>

                    <h2 class="font-weight-bold mb-2">¡Increíble Trabajo!</h2>
                    <p class="text-muted mb-4">Has completado el Nivel 4 con éxito.</p>

                    <div class="p-4 bg-light rounded-lg border mb-4"
                        style="background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);">
                        <div class="row">
                            <div class="col-6">
                                <h6 class="text-uppercase small font-weight-bold text-primary">Aciertos</h6>
                                <h3 id="modalAciertos" class="font-weight-bold text-dark">0</h3>
                            </div>
                            <div class="col-6 border-left">
                                <h6 class="text-uppercase small font-weight-bold text-success">Puntos</h6>
                                <h3 id="modalPuntos" class="font-weight-bold text-dark">0</h3>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-primary btn-lg btn-block rounded-pill shadow"
                        onclick="window.location.href='index.html'">
                        ¡Genial! Volver al Menú
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalLogro" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content border-0 shadow-lg text-center"
                style="border-radius: 25px; background: linear-gradient(145deg, #ffffff, #f0f0f0);">
                <div class="modal-body py-5">
                    <div id="logroIconContainer" class="mb-4">
                        <i id="logroIcono" class="bi bi-award-fill"
                            style="font-size: 5rem; color: #ffc107; filter: drop-shadow(0 0 10px rgba(255,193,7,0.5));"></i>
                    </div>
                    <h2 class="font-weight-bold text-dark mb-2" id="logroTitulo">¡LOGRO DESBLOQUEADO!</h2>
                    <h4 class="text-primary mb-3" id="logroNombre">Nombre del Logro</h4>
                    <p class="text-muted px-4" id="logroDesc">Descripción del logro obtenido.</p>
                    <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 shadow"
                        data-dismiss="modal">¡GENIAL!</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Datos del Nivel 3: Experto
            const preguntasNivel4 = [
                { q: '5² + 10', options: ['20', '35', '25', '30'], answer: 1 }, // 25 + 10
                { q: '√81 + 3', options: ['12', '9', '11', '10'], answer: 0 },  // 9 + 3
                { q: '2³ - 4', options: ['2', '4', '6', '8'], answer: 1 },     // 8 - 4
                { q: '15% de 200', options: ['20', '35', '30', '45'], answer: 2 }, // (15 * 2)
                { q: '12 × 12', options: ['144', '124', '134', '154'], answer: 0 }
            ];

            // Inicializamos el juego. 
            // Como es el último nivel, el número de desbloqueo puede ser el mismo o uno mayor.
            initGame(preguntasNivel4, 5);

        });
    </script>
</body>

</html>
