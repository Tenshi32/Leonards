<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeekerMind - Word Search Challenge</title>
    <link rel="icon" type="image/png" href="../dist/image/logotipo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/introjs.min.css">
    <link rel="stylesheet" href="../dist/css/index.css">
</head>

<body class="hold-transition d-flex flex-column min-vh-100">

    <div class="container py-2">
        <div class="game-container">
            <div class="card main-card shadow-lg">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <small id="progressText" class="font-weight-bold text-uppercase text-muted"
                            data-intro="Aquí verás cuántas preguntas te faltan para ganar." data-step="1">

                            <h1 id="timerDisplay" class="display-3 font-weight-bold mb-3">00:00</h1>

                        </small>
                        <span id="liveScore" class="badge badge-pill badge-primary px-3"
                            data-intro="¡Cada acierto te da 500 puntos! Intenta conseguir el máximo." data-step="2">
                            Puntos: 0
                        </span>

                        <div id="themeContainer">
                            <button class="btn btn-sm btn-info rounded-circle" id="helpBtn">
                                <i class="bi bi-question-lg"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-light rounded-circle" id="themeToggle"
                                aria-label="Cambiar tema">
                                <i class="bi bi-moon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="progress-container mb-3">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>

                    <div class="question-box text-center"
                        data-intro="Lee con atención el problema matemático aquí arriba." data-step="3">
                        <main class="flex-fill">
                            <div class="container-fluid mt-4">
                                <div class="row">
                                    <div class="col-md-3">
                                        <div class="card bg-dark text-white shadow">
                                            <div class="card-header border-info">
                                                <h5 class="mb-0 text-info">Palabras</h5>
                                            </div>
                                            <div class="card-body">
                                                <ul id="wordList" class="list-group list-group-flush bg-transparent">
                                                </ul>
                                            </div>
                                        </div>


                                    </div>

                                    <div class="col-md-9">
                                        <div id="gameContainer"
                                            class="d-flex justify-content-center align-items-center">
                                            <div id="wordSearchGrid" class="seeker-grid">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    <div id="optionsList" class="row no-gutters"
                        data-intro="Elige la respuesta correcta haciendo clic en uno de estos botones." data-step="4">
                    </div>

                    <div class="mt-4 d-flex justify-content-between align-items-center">
                        <button class="btn btn-sm btn-link text-muted" id="backBtn">
                            <i class="bi bi-box-arrow-left"></i> Salir
                        </button>

                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="tutorialModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document" aria-modal="true">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Bienvenido a MathRush</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar"><span
                            aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body text-center">
                    <p>¡Hola! Elige tu nivel y demuestra tu agilidad mental.</p>
                    <button type="button" class="btn btn-primary btn-block" id="startFromModal">¡Entendido!</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/intro.min.js"></script>
    <script src="../dist/js/game.js"></script>
    <script src="../dist/js/pages/sopa.js"></script>
</body>

</html>
