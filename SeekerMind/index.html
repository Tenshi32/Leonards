<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeekerMind - Word Search Challenge</title>
    <link rel="icon" type="image/png" href="/st/img/logotipo.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/introjs.min.css">
    <link rel="stylesheet" href="../dist/css/index.css">
</head>

<body class="hold-transition d-flex flex-column min-vh-100">
    <main class="flex-fill">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-lg border-0" style="border-radius: 15px;">
                        <div class="hero-section py-4 text-center"
                            style="background: linear-gradient(135deg, #17a2b8 0%, #0056b3 100%);">
                            <div class="d-flex justify-content-between align-items-center px-3">
                                <div id="themeContainer">
                                    <button class="btn btn-sm btn-outline-light rounded-circle" id="themeToggle"
                                        aria-label="Cambiar tema">
                                        <i class="bi bi-moon"></i>
                                    </button>
                                </div>
                                <div>
                                    <h1 class="display-4 font-weight-bold mb-0">
                                        <img src="../dist/image/logotipo.png" alt="Logo SeekerMind" class="responsive-logo"
                                            style="max-width: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
                                    </h1>
                                    <p class="lead mb-0 text-white-50">¿Qué tan rápido encuentras?</p>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-info rounded-circle" id="helpBtn">
                                        <i class="bi bi-question-lg"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-center mt-3">
                                <span class="badge badge-warning mx-2 p-2 shadow-sm">🏆 Record: <strong
                                        id="valRecord">0</strong></span>
                                <span class="badge badge-info mx-2 p-2 shadow-sm">🔍 Encontradas: <strong
                                        id="valTotal">0</strong></span>
                                <span class="badge badge-success mx-2 p-2 shadow-sm">⭐ Nivel: <strong
                                        id="valNivel">1</strong></span>
                            </div>
                        </div>

                        <div class="card-body p-4 text-center">
                            <button class="btn btn-info btn-lg btn-block mb-3 rounded-pill shadow btn-play" id="playBtn"
                                aria-label="Empezar a buscar">
                                <i class="bi bi-search mr-2" aria-hidden="true"></i> <span>¡EMPEZAR A BUSCAR!</span>
                            </button>

                            <hr>

                            <div class="form-group text-left">
                                <label class="text-muted small font-weight-bold">CATEGORÍA DE PALABRAS</label>
                                <select class="form-control form-control-lg border-info" id="difficultySelect">
                                    <option value="animales.html">🐾 Animales & Mascotas</option>
                                    <option value="frutas.html">🍎 Frutas & Comida</option>
                                    <option value="colores.html">🎨 Colores & Arte</option>
                                    <option value="familia.html">🏠 Familia & Hogar</option>
                                    <option value="profesiones.html">💼 Profesiones</option>
                                </select>
                            </div>
                            
                            <div class="btn-group btn-group-toggle" data-toggle="buttons">
                                <label class="btn btn-outline-light btn-sm active">
                                    <input type="radio" name="langOptions" value="es" checked> ES
                                </label>
                                <label class="btn btn-outline-light btn-sm">
                                    <input type="radio" name="langOptions" value="en"> EN
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="tutorialModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document" aria-modal="true">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title font-weight-bold">Bienvenido a SeekerMind</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center p-4">
                    <i class="bi bi- eyeglasses display-4 text-info mb-3"></i>
                    <p>¡Hola detective! Selecciona una categoría y encuentra todas las palabras ocultas antes de que se
                        acabe el tiempo.</p>
                    <button type="button" class="btn btn-info btn-block btn-lg rounded-pill" id="startFromModal">¡Acepto
                        el reto!</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/intro.min.js"></script>
    <script src="dist/js/index.js"></script>
</body>

</html>
